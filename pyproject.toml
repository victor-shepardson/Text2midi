[project]
name = "text2midi"
version = "0.1.0"
description = "Text2midi: Generating Symbolic Music from Captions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "einops",
    "huggingface-hub",
    "jsonlines",
    "miditok>=3.0.3",
    "numpy",
    "sentencepiece",
    "st-moe-pytorch",
    "torch",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
train = [
    "datasets",
    "deepspeed",
    "evaluate",
    "pyyaml",
    "spacy",
    "wandb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2midi"]
